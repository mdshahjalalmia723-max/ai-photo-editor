<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Photo Enhancer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh; color: white;
    padding: 15px;
}
.card {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 20px;
    width: 100%; max-width: 480px;
    margin: 0 auto;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    text-align: center;
}
h2 {
    font-size: 22px; font-weight: 700;
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 5px;
}
p.subtitle { font-size: 12px; color: #ccc; margin-bottom: 15px; }
.placeholder-box {
    width: 100%; height: 240px;
    border: 2px dashed rgba(255,255,255,0.25);
    border-radius: 15px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    margin-bottom: 15px; background: rgba(0,0,0,0.2);
}
.placeholder-box span { font-size: 40px; margin-bottom: 10px; }
.placeholder-box p { font-size: 14px; color: #aaa; }
.img-box {
    position: relative; width: 100%; height: 300px;
    margin-bottom: 15px; overflow: hidden;
    display: none; border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    background: #000;
}
.img-box img {
    width: 100%; height: 100%;
    object-fit: contain; position: absolute;
    top: 0; left: 0;
}
.after-img { clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); }
.divider-line {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 3px;
    background: white;
    z-index: 20;
    pointer-events: none;
    box-shadow: 0 0 8px rgba(255,255,255,0.8);
}
.tag {
    position: absolute; top: 10px;
    background: rgba(0,0,0,0.7); color: #fff;
    padding: 3px 10px; font-size: 10px;
    font-weight: bold; border-radius: 20px;
    letter-spacing: 1px; z-index: 10;
}
.tag-before { left: 10px; }
.tag-after { right: 10px; color: #ff416c; }
.slider {
    width: 100%; margin-bottom: 12px;
    accent-color: #ff416c; cursor: pointer;
}
.section-title {
    font-size: 12px; color: #ff416c;
    font-weight: bold; text-align: left;
    margin: 12px 0 6px 0;
    letter-spacing: 1px;
}
.filter-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px; margin-bottom: 12px;
}
.filter-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff; padding: 8px 4px;
    border-radius: 10px; font-size: 10px;
    cursor: pointer; font-weight: 600;
}
.filter-btn.active {
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    border-color: #ff416c;
}
input[type="range"] {
    width: 100%; accent-color: #ff416c;
    margin-bottom: 8px;
}
input[type="file"] { display: none; }
.btn-group {
    display: flex; gap: 8px;
    justify-content: center; flex-wrap: wrap;
    margin-top: 10px;
}
.btn {
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    color: white; padding: 10px 16px;
    border-radius: 25px; border: none;
    font-weight: 600; font-size: 13px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255,65,108,0.4);
    text-decoration: none; display: inline-block;
}
.btn-small {
    padding: 8px 12px; font-size: 12px;
    background: rgba(255,255,255,0.12);
    box-shadow: none;
    border: 1px solid rgba(255,255,255,0.2);
}
.btn-download {
    background: linear-gradient(45deg, #11998e, #38ef7d);
    box-shadow: 0 4px 12px rgba(56,239,125,0.3);
    display: none;
}
.loading {
    display: none; margin: 12px 0;
    font-size: 13px; color: #ff416c;
    font-weight: bold;
}
.loading.active { display: block; }
.controls-box {
    display: none; text-align: left;
    background: rgba(0,0,0,0.2);
    padding: 12px; border-radius: 12px;
    margin-bottom: 10px;
}
.control-row {
    display: flex; align-items: center;
    gap: 8px; margin-bottom: 8px;
}
.control-row label {
    font-size: 11px; width: 70px;
    color: #ccc; font-weight: 600;
}
.control-row input[type="range"] { flex: 1; margin: 0; }
.control-row span {
    font-size: 11px; width: 35px;
    text-align: right; color: #ff416c;
    font-weight: bold;
}
</style>
</head>
<body>
<div class="card">
    <h2>AI Photo Enhancer</h2>
    <p class="subtitle">Flawless Skin Retouch</p>

    <div class="placeholder-box" id="placeholder">
        <span>📷</span>
        <p>গ্যালারি থেকে একটি ছবি আপলোড করুন</p>
    </div>

    <div class="img-box" id="imgBox">
        <div class="tag tag-before">BEFORE</div>
        <div class="tag tag-after">AFTER</div>
        <img id="beforeImg" src="" alt="Original">
        <img id="afterImg" class="after-img" src="" alt="After">
        <div class="divider-line" id="dividerLine"></div>
    </div>

    <input type="range" min="0" max="100" value="50" class="slider"
           id="slider" oninput="moveSlider(this.value)" style="display:none;">

    <div class="loading" id="loading">⏳ AI প্রসেস করছে... অপেক্ষা করুন</div>

    <div class="controls-box" id="controlsBox">
        <div class="section-title">✨ FILTERS</div>
        <div class="filter-grid">
            <button class="filter-btn active" onclick="applyFilter('none', this)">Original</button>
            <button class="filter-btn" onclick="applyFilter('warm', this)">Warm</button>
            <button class="filter-btn" onclick="applyFilter('bw', this)">B&W</button>
            <button class="filter-btn" onclick="applyFilter('hd', this)">HD+</button>
        </div>

        <div class="section-title">🎛️ ADJUST</div>
        <div class="control-row">
            <label>Bright</label>
            <input type="range" min="50" max="150" value="100" id="brightSlider" oninput="adjust('bright', this.value)">
            <span id="brightVal">100</span>
        </div>
        <div class="control-row">
            <label>Contrast</label>
            <input type="range" min="50" max="150" value="100" id="contrastSlider" oninput="adjust('contrast', this.value)">
            <span id="contrastVal">100</span>
        </div>
        <div class="control-row">
            <label>Color</label>
            <input type="range" min="50" max="150" value="100" id="colorSlider" oninput="adjust('color', this.value)">
            <span id="colorVal">100</span>
        </div>
    </div>

    <div class="btn-group">
        <label class="btn" for="fileInput">ছবি নির্বাচন করুন</label>
        <input type="file" id="fileInput" name="image" accept="image/*" onchange="uploadImage()">
        <button class="btn btn-small" onclick="rotateImage(90)" id="rotateBtn" style="display:none;">↻ Rotate</button>
        <a id="downloadBtn" class="btn btn-download" download="enhanced_hd.jpg">সেভ 📥</a>
    </div>
</div>

<script>
var currentImageName = '';
var currentFilter = 'none';
var currentAdjust = {bright: 100, contrast: 100, color: 100};

function uploadImage() {
    var loading = document.getElementById('loading');
    loading.classList.add('active');

    var fileInput = document.getElementById('fileInput');
    var formData = new FormData();
    formData.append('image', fileInput.files[0]);

    fetch('/enhance', { method: 'POST', body: formData })
    .then(function(res) { return res.json(); })
    .then(function(data) {
        loading.classList.remove('active');
        if (data.error) {
            alert('সমস্যা: ' + data.error);
            return;
        }
        currentImageName = data.enhanced;
        currentFilter = 'none';
        currentAdjust = {bright: 100, contrast: 100, color: 100};

        document.getElementById('beforeImg').src = data.original;
        document.getElementById('afterImg').src = data.enhanced + '?t=' + Date.now();

        document.getElementById('brightSlider').value = 100;
        document.getElementById('contrastSlider').value = 100;
        document.getElementById('colorSlider').value = 100;
        document.getElementById('brightVal').innerText = '100';
        document.getElementById('contrastVal').innerText = '100';
        document.getElementById('colorVal').innerText = '100';

        var btns = document.querySelectorAll('.filter-btn');
        for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
        btns[0].classList.add('active');

        document.getElementById('placeholder').style.display = 'none';
        document.getElementById('imgBox').style.display = 'block';
        document.getElementById('slider').style.display = 'block';
        document.getElementById('controlsBox').style.display = 'block';
        document.getElementById('rotateBtn').style.display = 'inline-block';
        document.getElementById('downloadBtn').style.display = 'inline-block';
        document.getElementById('downloadBtn').href = '/download/' + data.enhanced.split('/').pop();
    })
    .catch(function(err) {
        loading.classList.remove('active');
        alert('নেটওয়ার্ক সমস্যা: ' + err);
    });
}

function moveSlider(val) {
    document.getElementById('afterImg').style.clipPath =
        'polygon(0 0, ' + val + '% 0, ' + val + '% 100%, 0 100%)';
    var line = document.getElementById('dividerLine');
    if (line) line.style.left = val + '%';
}

function applyFilter(filterName, btn) {
    currentFilter = filterName;
    var btns = document.querySelectorAll('.filter-btn');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
    btn.classList.add('active');
    reprocess();
}

function adjust(type, val) {
    currentAdjust[type] = parseInt(val);
    document.getElementById(type + 'Val').innerText = val;
    reprocess();
}

function rotateImage(deg) {
    reprocessRotate(deg);
}

function reprocess() {
    var loading = document.getElementById('loading');
    loading.classList.add('active');

    fetch('/reprocess', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            image: currentImageName,
            filter: currentFilter,
            rotation: 0,
            bright: currentAdjust.bright,
            contrast: currentAdjust.contrast,
            color: currentAdjust.color
        })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
        loading.classList.remove('active');
        if (data.error) {
            alert('সমস্যা: ' + data.error);
            return;
        }
        currentImageName = data.enhanced;
        document.getElementById('afterImg').src = data.enhanced + '?t=' + Date.now();
        document.getElementById('downloadBtn').href = '/download/' + data.enhanced.split('/').pop();
    })
    .catch(function(err) {
        loading.classList.remove('active');
        alert('সমস্যা: ' + err);
    });
}

function reprocessRotate(deg) {
    var loading = document.getElementById('loading');
    loading.classList.add('active');

    fetch('/reprocess', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            image: currentImageName,
            filter: 'none',
            rotation: deg,
            bright: 100,
            contrast: 100,
            color: 100
        })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
        loading.classList.remove('active');
        if (data.error) {
            alert('সমস্যা: ' + data.error);
            return;
        }
        currentImageName = data.enhanced;
        document.getElementById('afterImg').src = data.enhanced + '?t=' + Date.now();
        document.getElementById('downloadBtn').href = '/download/' + data.enhanced.split('/').pop();
    })
    .catch(function(err) {
        loading.classList.remove('active');
        alert('সমস্যা: ' + err);
    });
}
</script>
</body>
</html>
